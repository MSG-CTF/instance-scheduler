# 실연동 설정, fake 없이 실제 Broker와 Runtime 서버를 부른다
# 직접 켜지 않고 dev와 prod 프로파일 그룹으로 함께 켜진다
scheduler:
  api:
    token: ${SCHEDULER_API_TOKEN}
  broker:
    base-url: https://broker.mjsec.kr/api
    token: ${SCHEDULER_BROKER_TOKEN}
  runtime:
    base-url: ${SCHEDULER_RUNTIME_BASE_URL}
    token: ${SCHEDULER_RUNTIME_TOKEN}
  cleanup:
    enabled: true
    fixed-delay: 30s
    retry-limit: 5
  operation:
    # 생성·정리 중인 작업만 빠르게 확인한다, 조회 장애는 별도 backoff를 유지한다
    fixed-delay: 1s
    # 브로커가 자리 없다고 답한 요청은 앞선 인스턴스가 기본 CPU로 돌아가 자리가 날 때까지 재시도한다
    # 넘침 시험(11-05)은 개발 서버의 이 값 10으로 통과했고 3번째 재시도까지 쓰였다, 기본값 3이면 그 요청이 FAILED로 끝난다
    # 인증 오류나 연결 장애에도 같은 횟수를 쓰므로 FAILED로 확정되기까지 약 3분이 걸린다
    broker-retry-limit: 10
    # 워커가 한 단계의 대상을 동시에 처리하는 스레드 수, 브로커 팀이 동시 8개를 확인했다
    # 후보 하나의 자리보다 커도 된다, 예약이 자리 부족으로 거절되면 같은 주기에 다음 후보로 넘어간다
    parallelism: 8
    # 몰릴 때 단계마다 이만큼씩 나눠 처리해 먼저 온 요청이 먼저 RUNNING이 되게 한다
    # 폴링 조회에도 걸려서 작으면 끝난 operation 확인이 늦어진다, 대회 규모인 200건은 한 주기에 다 잡는다
    batch-size: 200
    # 나눠 처리하면 끝나지 않은 operation을 주기마다 다시 묻게 되어 간격의 하한을 둔다
    min-poll-interval: 1s

spring:
  datasource:
    hikari:
      # 워커가 동시에 쥐는 커넥션은 실행 스레드 8개와 스케줄 워커 3개로 많아야 11개, 남은 9개 안팎이 API 몫이다
      # 모자라면 connection-timeout(application.yaml, 3초)만큼 기다리고 실패한다
      maximum-pool-size: 20
