# 개발 서버 실연동 프로파일, fake 없이 실제 Broker와 Runtime 서버를 부른다
scheduler:
  api:
    token: ${SCHEDULER_API_TOKEN}
  broker:
    base-url: https://broker.mjsec.kr/api
    token: ${SCHEDULER_BROKER_TOKEN}
  runtime:
    base-url: ${SCHEDULER_RUNTIME_BASE_URL}
    token: ${SCHEDULER_RUNTIME_TOKEN}
  cleanup:
    enabled: true
    fixed-delay: 30s
    retry-limit: 5
  operation:
    # 워커가 한 단계의 대상을 동시에 처리하는 스레드 수, 브로커 후보 하나가 받는 자리 수보다 작게 둔다
    parallelism: 4
    # 몰릴 때 단계마다 이만큼씩 나눠 처리해 먼저 온 요청이 먼저 RUNNING이 되게 한다, 병렬 수의 열 배쯤
    batch-size: 40
    # 나눠 처리하면 끝나지 않은 operation을 주기마다 다시 묻게 되어 간격의 하한을 둔다
    min-poll-interval: 5s

spring:
  datasource:
    hikari:
      # 워커 스레드마다 커넥션 하나에 API 몫 10개, 모자라면 connection-timeout 30초를 기다린다
      maximum-pool-size: 20

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
