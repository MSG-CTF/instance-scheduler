# 개발 서버 프로파일, 실연동 설정(real)과 함께 켜지고 확인용 화면을 더 연다
# 데모 화면은 DemoPageController가 local, dev에서만 등록한다
# 그룹 구성원인 real이 dev 뒤에 켜지므로 같은 키를 여기 적으면 real 값이 이긴다
# 개발 서버만 값을 다르게 하려면 그 키를 real에서 빼고 여기와 prod 쪽에 따로 둔다
scheduler:
  instance-policy:
    # 개발 서버 E2E(loadtest/e2e-create.sh)가 공개 nginx 이미지로 런타임 왕복을 확인한다
    # 목록은 기본값을 덮어쓰므로 대회 문제 저장소도 다시 적는다
    allowed-image-prefixes:
      - ghcr.io/msg-ctf/challenges/
      - ghcr.io/nginxinc/

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
