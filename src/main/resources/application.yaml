spring:
  application:
    name: scheduler
  profiles:
    # 실연동 설정(real)은 개발 서버와 대회 운영이 함께 쓴다
    # dev는 데모 화면과 API 문서를 더 열고, prod는 둘 다 닫은 채 기본값을 쓴다
    group:
      dev: real
      prod: real
  datasource:
    hikari:
      # DB가 없을 때 요청과 워커가 기본값 30초씩 매달리지 않게 짧게 자른다
      # 2026-10-27 시험에서 Postgres 재시작 동안 생성 응답이 p50 30초였고 Tomcat 스레드가 쌓였다
      # 빨리 실패해야 백엔드가 재시도하고 health가 바로 DOWN을 알린다, 값은 밀리초다
      connection-timeout: 3000
      # 끊어진 연결을 검증할 때 기다리는 시간, 연결 대기보다 짧아야 한다
      validation-timeout: 2000
  jpa:
    # 요청이 끝날 때까지 DB 연결을 쥐지 않게 끈다
    # Windows 배정 API는 요청 스레드에서 브로커를 부르므로, 켜 두면 브로커를 기다리는 동안 연결 풀을 잡아먹는다
    # 지연 로딩 관계가 없어 끄더라도 응답을 만들 때 추가 조회가 생기지 않는다
    open-in-view: false
  jackson:
    property-naming-strategy: SNAKE_CASE
  task:
    execution:
      # Executor 빈(operationWorkerExecutor)이 있으면 Boot는 applicationTaskExecutor를 안 만든다, force가 그대로 만들게 한다
      mode: force
    scheduling:
      pool:
        # 기본은 1이라 operation 워커 한 주기가 끝날 때까지 cleanup 워커가 못 돈다
        # 워커마다 한 스레드씩 쓰게 한다, 같은 워커는 fixedDelay라 스스로 겹치지 않는다
        # @Scheduled 워커를 더하면 이 값도 그만큼 늘린다
        # operation 워커, cleanup 워커, 반납 대기 예약 정리 세 개다
        size: 3

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

scheduler:
  image-readiness:
    enabled: false
    lookup-timeout: 300ms
    cache-ttl: 10s
    max-observation-age: 60s
    # 조회가 실패하면 생성마다 기다리지 않도록 잠시 묻지 않는다, 404와 503은 런타임에 기능이 없는 것이라 더 길게 쉰다
    failure-backoff: 30s
    not-found-backoff: 5m
    # 런타임 조회 경로는 전용 토큰만 받는다, 켤 때 비어 있으면 기동을 막는다
    token: ${SCHEDULER_IMAGE_READINESS_TOKEN:}
  instance-policy:
    release-metadata-enabled: false
