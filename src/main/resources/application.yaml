spring:
  application:
    name: scheduler
  profiles:
    # 실연동 설정(real)은 개발 서버와 대회 운영이 함께 쓴다
    # dev는 데모 화면과 API 문서를 더 열고, prod는 둘 다 닫은 채 기본값을 쓴다
    group:
      dev: real
      prod: real
  jpa:
    # 요청이 끝날 때까지 DB 연결을 쥐지 않게 끈다
    # Windows 배정 API는 요청 스레드에서 브로커를 부르므로, 켜 두면 브로커를 기다리는 동안 연결 풀을 잡아먹는다
    # 지연 로딩 관계가 없어 끄더라도 응답을 만들 때 추가 조회가 생기지 않는다
    open-in-view: false
  jackson:
    property-naming-strategy: SNAKE_CASE
  task:
    execution:
      # Executor 빈(operationWorkerExecutor)이 있으면 Boot는 applicationTaskExecutor를 안 만든다, force가 그대로 만들게 한다
      mode: force
    scheduling:
      pool:
        # 기본은 1이라 operation 워커 한 주기가 끝날 때까지 cleanup 워커가 못 돈다
        # 워커마다 한 스레드씩 쓰게 한다, 같은 워커는 fixedDelay라 스스로 겹치지 않는다
        # @Scheduled 워커를 더하면 이 값도 그만큼 늘린다
        size: 2

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

scheduler:
  image-readiness:
    enabled: false
    lookup-timeout: 300ms
    cache-ttl: 10s
    max-observation-age: 60s
  instance-policy:
    release-metadata-enabled: false
